
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Define a codificação para aceitar acentos -->
    <meta charset="UTF-8">

    <!-- Adapta a página para celulares e computadores -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título que aparece na aba do navegador -->
    <title>Cálculo de Gastos</title>

    <!-- Conecta o arquivo CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Conecta o JavaScript.
         defer faz o navegador executar o JS depois de interpretar o HTML -->
    <script src="script.js" defer></script>

</head>

<body>

    <!-- Container principal da página -->
    <main class="container">

        <!-- Cabeçalho -->
        <header class="cabecalho">

            <h1>Cálculo de Gastos</h1>

            <p>Organize seu salário e controle suas despesas.</p>

        </header>


        <!-- RESUMO FINANCEIRO -->
        <section class="resumo">

            <!-- Cartão do salário -->
            <article class="cartao">

                <h2>Salário</h2>

                <p class="valor" id="salario-exibido">
                    R$ 0,00
                </p>

            </article>


            <!-- Cartão do total de gastos -->
            <article class="cartao">

                <h2>Total de gastos</h2>

                <p class="valor" id="gastos-exibido">
                    R$ 0,00
                </p>

            </article>


            <!-- Cartão do saldo disponível -->
            <article class="cartao destaque">

                <h2>Saldo disponível</h2>

                <p class="valor" id="saldo-exibido">
                    R$ 0,00
                </p>

            </article>

        </section>


        <!-- CADASTRO DO SALÁRIO -->
        <section class="painel">

            <h2>Meu salário</h2>

            <div class="grupo-formulario">

                <!-- Campo para informar o salário -->
                <label for="salario">Informe seu salário:</label>

                <input
                    type="number"
                    id="salario"
                    placeholder="Ex: 2500.00"
                    min="0"
                    step="0.01"
                >

                <!-- Botão que define o salário -->
                <button type="button" id="definir-salario">
                    Definir salário
                </button>

            </div>

        </section>


        <!-- CADASTRO DOS GASTOS -->
        <section class="painel">

            <h2>Adicionar gasto</h2>

            <div class="formulario-gastos">

                <!-- Nome do gasto ou da fatura -->
                <div class="grupo-formulario">

                    <label for="descricao">Nome do gasto:</label>

                    <input
                        type="text"
                        id="descricao"
                        placeholder="Ex: Conta de água"
                    >

                </div>


                <!-- Descrição detalhada do gasto -->
                <div class="grupo-formulario">

                    <label for="observacao">
                        Descrição / observação:
                    </label>

                    <!-- textarea permite escrever várias linhas -->
                    <textarea
                        id="observacao"
                        rows="4"
                        placeholder="Explique do que se trata esse gasto..."
                    ></textarea>

                </div>


                <!-- Categoria do gasto -->
                <div class="grupo-formulario">

                    <label for="categoria">Categoria:</label>

                    <select id="categoria">

                        <option value="">Selecione uma categoria</option>

                        <option value="Moradia">Moradia</option>

                        <option value="Alimentação">Alimentação</option>

                        <option value="Transporte">Transporte</option>

                        <option value="Lazer">Lazer</option>

                        <option value="Contas">Contas</option>

                        <option value="Outros">Outros</option>

                    </select>

                </div>


                <!-- Valor da despesa -->
                <div class="grupo-formulario">

                    <label for="valor">Valor do gasto:</label>

                    <input
                        type="number"
                        id="valor"
                        placeholder="Ex: 150.00"
                        min="0"
                        step="0.01"
                    >

                </div>


                <!-- Botão de cadastro -->
                <button
                    type="button"
                    class="botao-adicionar"
                    id="adicionar-gasto"
                >
                    Adicionar gasto
                </button>

            </div>

        </section>


        <!-- LISTA DE GASTOS -->
        <section class="painel">

            <h2>Minha lista de gastos</h2>

            <div class="tabela-container">

                <table>

                    <!-- Cabeçalho da tabela -->
                    <thead>

                        <tr>

                            <th>Nome do gasto</th>

                            <th>Descrição</th>

                            <th>Categoria</th>

                            <th>Valor</th>

                            <th>Ação</th>

                        </tr>

                    </thead>


                    <!-- O JavaScript adicionará os gastos aqui -->
                    <tbody>

                        <tr>

                            <td colspan="5" class="lista-vazia">
                                Nenhum gasto cadastrado.
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>


        <!-- Rodapé -->
        <footer>

            <p>Projeto Cálculo de Gastos</p>

        </footer>

    </main>

</body>

</html>
